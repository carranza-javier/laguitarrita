<section id="hero" class="hero">
  <video
    #heroVideo
    class="hero-video"
    [class.video-ready]="videoReady()"
    src="https://d1sv0wy23k5ghd.cloudfront.net/javigranaina.mp4"
    autoplay
    loop
    playsinline
    (canplay)="onVideoReady()">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1 class="hero-name">{{ t().hero.name }}</h1>
    <p class="hero-tagline">{{ t().hero.tagline }}</p>
    <p class="hero-sub">{{ t().hero.sub }}</p>
  </div>

  <button
    mat-icon-button
    class="mute-btn"
    (click)="toggleMute()"
    [attr.aria-label]="muted() ? t().hero.soundOn : t().hero.soundOff">
    <mat-icon>{{ muted() ? 'volume_off' : 'volume_up' }}</mat-icon>
  </button>

  @if (showHint() && muted()) {
    <div class="mute-hint" [class.fading]="hintFading()" (click)="toggleMute()">
      <mat-icon class="hint-desktop">south_east</mat-icon>
      <mat-icon class="hint-mobile">arrow_downward</mat-icon>
    </div>
  }

  <button class="scroll-hint" (click)="scrollToAbout()" aria-label="Scroll down">
    <mat-icon>keyboard_arrow_down</mat-icon>
  </button>
</section>
