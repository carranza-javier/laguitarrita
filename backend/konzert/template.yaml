AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  laguitarrita.ch public concert tickets: a single DynamoDB table and two public
  HTTP API routes (GET /availability, POST /tickets). Attendees pay by TWINT directly
  to the teacher; this stack only records tickets and enforces the venue capacity with
  an atomic conditional write. Fully separate from the student-area stack.

Parameters:
  Capacity:
    Type: Number
    Default: 34
    Description: Maximum number of tickets (people) for the venue.
  PriceChf:
    Type: Number
    Default: 15
    Description: Price per ticket in CHF.
  ConcertIso:
    Type: String
    Default: '2027-02-21T17:00:00+01:00'
    Description: Concert start (ISO 8601). All ticket data is auto-deleted 30 days after it (TTL).
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://laguitarrita.ch,http://localhost:4200'
    Description: Browser origins allowed to call the API (CORS).
  ThrottleBurst:
    Type: Number
    Default: 10
    Description: API burst limit (anti-spam). Raised in the test stack so concurrency can be tested.
  ThrottleRate:
    Type: Number
    Default: 5
    Description: API steady request rate per second (anti-spam).
  Environment:
    Type: String
    AllowedValues: [prod, test]
    Default: prod
    Description: "prod enables deletion protection on the admin user pool; test leaves it off so the test stack can be deleted."

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TICKETS_TABLE: !Ref TicketsTable
        COUNTER_ID: '#counter'
        CAPACITY: !Ref Capacity
        PRICE_CHF: !Ref PriceChf
        CONCERT_ISO: !Ref ConcertIso

Resources:
  # One row per ticket (id = uuid) plus one reserved counter row (id = '#counter') that holds the
  # number of seats taken. Both the counter condition and the ticket insert happen in a single
  # TransactWriteItems, so concurrent buyers can never push the total past the capacity.
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-tickets
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Everything is removed 30 days after the concert.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  TicketsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        # authorization + PATCH are only needed by the private /admin routes; the public
        # routes keep working unchanged (they just ignore the extra allowances).
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, PATCH]
        MaxAge: 3600
      # Anti-spam: a low throttle on every route (per the whole stage).
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottleBurst
        ThrottlingRateLimit: !Ref ThrottleRate
      # A JWT authorizer for the admin pool. It is NOT the default authorizer, so the public
      # routes (/availability, /tickets) stay open; only the /admin routes opt in to it below.
      # Access tokens are used: API Gateway matches the token's client_id against the audience.
      Auth:
        Authorizers:
          AdminJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}
              audience:
                - !Ref AdminUserPoolClient

  AvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-availability
      CodeUri: src/availability/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref AvailabilityLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt TicketsTable.Arn
      Events:
        Availability:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /availability
            Method: GET

  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-create-ticket
      CodeUri: src/create-ticket/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref CreateTicketLogGroup
      Policies:
        - Statement:
            # TransactWriteItems over the single table: the counter update + the ticket insert.
            # GetItem is only used to report the seats left when a purchase is refused.
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
              Resource: !GetAtt TicketsTable.Arn
      Events:
        CreateTicket:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /tickets
            Method: POST

  # ---------------------------------------------------------------- Admin auth
  # A brand-new user pool, fully separate from the student-area pool. Sign-in by username only:
  # no e-mail/phone, nothing verified, no self-sign-up, no messages. A single admin user is created
  # by the backend/scripts/create-concert-admin script. Deletion protection is on in prod.
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-admin
      UserPoolTier: LITE
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-admin-web
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      # SRP only: the password itself never leaves the browser.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      AuthSessionValidity: 3
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

  # ---------------------------------------------------------------- Admin API
  # One function serving every /admin route (list, create, patch, cancel). All routes require a
  # valid access token from AdminUserPool; without it API Gateway answers 401 before the Lambda runs.
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-admin
      CodeUri: src/admin/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref AdminLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt TicketsTable.Arn
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /admin/tickets
            Method: GET
            Auth:
              Authorizer: AdminJwt
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /admin/tickets
            Method: POST
            Auth:
              Authorizer: AdminJwt
        Patch:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /admin/tickets/{id}
            Method: PATCH
            Auth:
              Authorizer: AdminJwt
        Cancel:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketsApi
            Path: /admin/tickets/{id}/cancel
            Method: POST
            Auth:
              Authorizer: AdminJwt

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin
      RetentionInDays: 30

  AvailabilityLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-availability
      RetentionInDays: 30

  CreateTicketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-create-ticket
      RetentionInDays: 30

Outputs:
  Region:
    Value: !Ref AWS::Region
  ApiUrl:
    Value: !Sub https://${TicketsApi}.execute-api.${AWS::Region}.amazonaws.com
  TicketsTableName:
    Value: !Ref TicketsTable
  Capacity:
    Value: !Ref Capacity
  PriceChf:
    Value: !Ref PriceChf
  ConcertIso:
    Value: !Ref ConcertIso
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminUserPoolClientId:
    Value: !Ref AdminUserPoolClient
