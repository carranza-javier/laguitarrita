version = 0.1

[default.global.parameters]
region = "eu-central-1"

[default.build.parameters]
cached = true

[default.deploy.parameters]
stack_name = "laguitarrita-students"
resolve_s3 = true
s3_prefix = "laguitarrita-students"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Environment=\"prod\""
tags = "project=\"laguitarrita-students\""

[test.global.parameters]
region = "eu-central-1"

[test.deploy.parameters]
stack_name = "laguitarrita-students-test"
resolve_s3 = true
s3_prefix = "laguitarrita-students-test"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Environment=\"test\""
tags = "project=\"laguitarrita-students\""
