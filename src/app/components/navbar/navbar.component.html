<mat-toolbar class="navbar">
  <span class="logo" (click)="scrollTo('hero')">La Guitarrita</span>

  <!-- Desktop nav -->
  <nav class="nav-links">
    <button mat-button (click)="scrollTo('about')">{{ ts.t().nav.about }}</button>
    <button mat-button (click)="scrollTo('classes')">{{ ts.t().nav.classes }}</button>
    <button mat-button (click)="scrollTo('prices')">{{ ts.t().nav.prices }}</button>
    <button mat-button (click)="scrollTo('contact')">{{ ts.t().nav.contact }}</button>
  </nav>

  <span class="spacer"></span>

  <!-- Language toggle -->
  <button mat-button class="lang-toggle" (click)="ts.toggle()">
    {{ ts.lang() === 'de' ? 'EN' : 'DE' }}
  </button>

  <!-- Mobile hamburger -->
  <button mat-icon-button class="menu-btn" [matMenuTriggerFor]="mobileMenu" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu" class="mobile-menu">
  <button mat-menu-item (click)="scrollTo('about')">{{ ts.t().nav.about }}</button>
  <button mat-menu-item (click)="scrollTo('classes')">{{ ts.t().nav.classes }}</button>
  <button mat-menu-item (click)="scrollTo('prices')">{{ ts.t().nav.prices }}</button>
  <button mat-menu-item (click)="scrollTo('contact')">{{ ts.t().nav.contact }}</button>
  <button mat-menu-item (click)="ts.toggle()">
    {{ ts.lang() === 'de' ? 'Switch to English' : 'Auf Deutsch wechseln' }}
  </button>
</mat-menu>
