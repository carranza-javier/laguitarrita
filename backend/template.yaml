AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  laguitarrita.ch private student area: Cognito user pool (admin-created users only),
  private S3 bucket with per-student class videos and an HTTP API that returns
  short-lived presigned URLs for the caller's own videos.

Parameters:
  Environment:
    Type: String
    AllowedValues: [prod, test]
    Default: prod
    Description: "prod enables deletion protection on the user pool."
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://laguitarrita.ch,http://localhost:4200"
    Description: Browser origins allowed to call the API and fetch videos (CORS).

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # ---------------------------------------------------------------- Auth
  StudentsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UserPoolTier: LITE
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      # No self-sign-up: only the teacher creates students (AdminCreateUser).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # No self-service recovery and no e-mails: passwords are reset by the admin script.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  StudentsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref StudentsUserPool
      GenerateSecret: false
      # SRP only: the password itself never leaves the browser.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      AuthSessionValidity: 3
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

  # ---------------------------------------------------------------- Storage
  # Videos are permanent: no lifecycle rules, and the bucket survives stack deletion.
  VideosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-videos-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ['*']
            ExposedHeaders: [Content-Length, Content-Range, Accept-Ranges, ETag]
            MaxAge: 3600

  VideosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VideosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt VideosBucket.Arn
              - !Sub ${VideosBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------- API
  VideosApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization]
        AllowMethods: [GET]
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${StudentsUserPool}
              audience:
                - !Ref StudentsUserPoolClient

  ListVideosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-list-videos
      CodeUri: src/list-videos/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref ListVideosLogGroup
      Environment:
        Variables:
          BUCKET_NAME: !Ref VideosBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt VideosBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: students/*
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${VideosBucket.Arn}/students/*
      Events:
        ListVideos:
          Type: HttpApi
          Properties:
            ApiId: !Ref VideosApi
            Path: /videos
            Method: GET

  ListVideosLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-list-videos
      RetentionInDays: 30

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref StudentsUserPool
  UserPoolClientId:
    Value: !Ref StudentsUserPoolClient
  BucketName:
    Value: !Ref VideosBucket
  ApiUrl:
    Value: !Sub https://${VideosApi}.execute-api.${AWS::Region}.amazonaws.com
